[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "tg_price_alerts"
version = "0.2.1"
description = "Small background daemon for crypto and stock price alerts over Telegram"
authors = [
    { name = "Alexey K." }
]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27.0",
    "pyyaml>=6.0.1",
]

[project.scripts]
tg-price-alerts = "tg_price_alerts.__main__:main"

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "ruff>=0.1.0",
]

[tool.ruff]
line-length = 100
target-version = "py310"
